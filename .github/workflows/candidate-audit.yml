name: Audit verified replacement candidates
on:
  workflow_dispatch:
  # Stagger candidate scans 12h apart, midway between the 01/05/09/13/17/21 UTC
  # main refreshes, leaving API headroom. GITHUB_TOKEN has a shared per-repo hourly API quota;
  # overlapping two near-850-call jobs risks throttling both.
  # Scheduled delivery can be delayed, so actual run outcomes are audited.
  schedule:
    - cron: '23 3,15 * * *'
  # Deliberately no push trigger: avoid an unplanned second candidate audit
  # during main refresh or a rapid burst of code-only commits.
permissions:
  contents: read
concurrency:
  group: candidate-audit-main
  cancel-in-progress: false
jobs:
  candidate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The GitHub Actions repository token has a finite API quota.
      # Target ~32 strict source probes per run, not a blind 96-repo assertion.
      CANDIDATE_REQUEST_BUDGET: '850'
      CANDIDATE_POOL_LIMIT: '96'
      CANDIDATE_PROBE_LIMIT: '32'
      CANDIDATE_ROTATION_HOURS: '6'
      CANDIDATE_CHEAPEST_FIRST: '1'
      MAX_PAGES_PER_SOURCE: '6'
      PER_PAGE: '100'
      MAX_RETRIES: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit actual public candidate Issues, PR and CI coverage
        run: python scripts/audit_candidate_pool.py
      - name: Plan only diversity-matched candidate swaps (never apply)
        run: python scripts/replacement_plan.py candidate-verified-audit.json
      - name: Publish read-only proof; never modify curated selection
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-audit
          path: |
            candidate-verified-audit.json
            candidate-replacement-plan.json
          retention-days: 14
          if-no-files-found: error
