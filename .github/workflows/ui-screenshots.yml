name: Capture real Streamlit UI screenshots
on:
  push:
    branches:
      - review/project-delivery-monitor-streamlit
    paths:
      - scripts/capture_ui.py
      - .github/workflows/ui-screenshots.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_REPOS: '3'
      MAX_CANDIDATES: '8'
      MAX_PAGES_PER_SOURCE: '2'
      SEARCH_PAGES_PER_QUERY: '1'
      PER_PAGE: '30'
      BACKFILL_DAYS: '90'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI and screenshot dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Check Chrome availability
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            python -m playwright install chromium
          fi
      - name: Initialize temporary database
        run: python scripts/init_db.py
      - name: Attempt bounded public GitHub collection
        run: |
          python scripts/run_sync.py --discover || echo "Collection incomplete; screenshots must show true unavailable / partial statuses."
      - name: Capture actual browser screenshots
        run: python scripts/capture_ui.py
      - name: Upload PNG screenshots (not deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-purple-ui-actual-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
