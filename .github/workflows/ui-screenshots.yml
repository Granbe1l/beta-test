name: Capture Streamlit UI with verified GitHub snapshot
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-screenshots.yml
      - streamlit_app.py
      - scripts/capture_ui.py
      - src/ui/**
      - src/analytics/comparisons.py
      - src/analytics/findings.py
      - data/github_public_snapshot.json.gz
  pull_request:
    paths:
      - .github/workflows/ui-screenshots.yml
      - streamlit_app.py
      - scripts/capture_ui.py
      - src/ui/**
      - src/analytics/comparisons.py
      - src/analytics/findings.py
      - data/github_public_snapshot.json.gz
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Streamlit and real-browser dependencies
        run: python -m pip install -r requirements.txt playwright Pillow
      - name: Verify real GitHub snapshot and counts
        run: |
          python - <<'PY'
          from src.analytics.snapshot import read_snapshot
          rows,selection,meta=read_snapshot()
          assert len(rows)>0 and selection and selection.get("candidates",0)>0
          assert sum(len(r["issue_rows"])+len(r["pr_rows"]) for r in rows)>0
          print("Verified capture",meta["generated_at"],"repositories",len(rows))
          PY
      - name: Check Chrome availability
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version; else python -m playwright install chromium; fi
      - name: Benchmark current source snapshot
        run: python scripts/benchmark_snapshot.py
      - name: Capture rendered desktop and mobile screenshot
        run: python scripts/capture_ui.py
      - name: Verify screenshot-to-gallery conversion with real browser evidence
        run: python scripts/prepare_gallery.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-delivery-populated-ui-screenshots
          path: |
            docs/screenshots/*.png
            docs/screenshots/recruiter-browser-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compact verified gallery previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-delivery-gallery-preview-candidates
          path: |
            docs/gallery/*.jpg
            docs/gallery/manifest.json
          if-no-files-found: warn
          retention-days: 14

  # Only the trusted, successfully-tested main-branch screenshot artifact
  # may write permanent preview images. PRs retain read-only permissions.
  gallery:
    name: Commit verified screenshot previews to main
    needs: screenshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.screenshot.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish gallery only for UI or screenshot-code changes
        id: gate
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD |
             grep -E '^(src/ui/|streamlit_app\.py$|scripts/(capture_ui|prepare_gallery)\.py$|\.github/workflows/ui-screenshots\.yml$)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only snapshot/data changed. Preserve existing permanent gallery."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          name: project-delivery-populated-ui-screenshots
          path: docs/screenshots
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Convert verified Playwright PNGs to compact permanent previews
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install Pillow
          python scripts/prepare_gallery.py
      - name: Commit only actual preview images and provenance
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Binary JPEGs cannot safely rebase over another gallery writer.
          # Preserve ONLY the Playwright-verified artifact from this run.
          mkdir -p /tmp/verified-gallery
          cp docs/gallery/*.jpg docs/gallery/manifest.json /tmp/verified-gallery/
          for attempt in 1 2 3; do
            git fetch origin main

            # Never let an older UI run replace a newer, materially different
            # UI's captures. The newer push will run its own screenshot job.
            if git diff --name-only "$GITHUB_SHA" origin/main -- \
              src/ui/ streamlit_app.py scripts/capture_ui.py \
              scripts/prepare_gallery.py .github/workflows/ui-screenshots.yml \
              | grep -q .; then
              echo "A newer UI revision exists; retain its gallery."
              exit 0
            fi

            # Also reject out-of-order capture timestamps when unrelated
            # source/data changes, or concurrent galleries, have landed.
            if git show origin/main:docs/gallery/manifest.json \
                > /tmp/current-gallery-manifest.json 2>/dev/null; then
              if python - <<'PY'
          import json
          from pathlib import Path
          older = json.loads(Path("/tmp/current-gallery-manifest.json").read_text())
          candidate = json.loads(Path("/tmp/verified-gallery/manifest.json").read_text())
          raise SystemExit(0 if older.get("captured_in_ci_at_utc", "") >=
                            candidate.get("captured_in_ci_at_utc", "") else 1)
          PY
              then
                echo "Existing gallery capture is as recent or newer; keep it."
                exit 0
              fi
            fi

            git reset --hard origin/main
            cp /tmp/verified-gallery/*.jpg /tmp/verified-gallery/manifest.json docs/gallery/
            git add docs/gallery/*.jpg docs/gallery/manifest.json
            if git diff --cached --quiet; then
              echo "No gallery changes to commit."
              exit 0
            fi
            git commit -m "docs: publish verified Streamlit screenshot previews [skip ci]"
            if git push origin HEAD:main; then
              echo "Published verified gallery on attempt $attempt"
              exit 0
            fi
            echo "Concurrent main push; retrying from current main ($attempt/3)"
            sleep 2
          done
          echo "Unable to publish after three safe attempts."
          exit 1
