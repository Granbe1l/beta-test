name: Refresh curated public GitHub snapshot
on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/run_sync.py
      - scripts/restore_public_snapshot.py
      - .github/workflows/public-snapshot.yml
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-snapshot-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: sqlite:///local.sqlite3
      GITHUB_TOKEN: ${{ github.token }}
      MAX_REPOS: '75'
      MAX_CANDIDATES: '320'
      SEARCH_PAGES_PER_QUERY: '1'
      MAX_PAGES_PER_SOURCE: '6'
      PER_PAGE: '100'
      BACKFILL_DAYS: '120'
      COMPARISON_DAYS: '90'
      STALE_HOURS: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore last validated public snapshot
        run: python scripts/restore_public_snapshot.py
      - name: Expand to up to 75 vetted repos and sync within API budget
        shell: bash
        run: |
          python scripts/run_sync.py --expand --initial-batch 12 --max-requests 850 || echo 'Some sources incomplete or budget-limited; retained previous evidence and checkpoint.'
          python scripts/build_public_snapshot.py
          python scripts/audit.py > snapshot-audit.json
      - name: Preserve evidence and coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: github-75-repo-source-audit
          path: |
            data/github_public_snapshot.json.gz
            snapshot-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit only generated public snapshot
        shell: bash
        run: |
          git config user.name 'Candy Ristyan'
          git config user.email '103526238+Granbe1l@users.noreply.github.com'
          git add data/github_public_snapshot.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update verified GitHub sample [skip ci]'
          # New UI commits may land while the data collection is running.
          # Replay only this snapshot change onto the current main; never force-push.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected on main (attempt ${attempt}); retrying"
            sleep 3
          done
          echo 'Unable to publish data snapshot safely after three attempts'
          exit 1
