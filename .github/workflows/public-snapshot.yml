name: Refresh curated public GitHub snapshot
on:
  # Collection runs on schedule, by manual dispatch, and when this precise
  # pipeline workflow is changed. Ordinary UI/code pushes never recollect.
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-snapshot.yml'
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: public-snapshot-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: sqlite:///local.sqlite3
      GITHUB_TOKEN: ${{ github.token }}
      MAX_REPOS: '50'
      MAX_CANDIDATES: '320'
      SEARCH_PAGES_PER_QUERY: '1'
      MAX_PAGES_PER_SOURCE: '6'
      BACKLOG_SEARCH_MAX_CALLS: '12'  # Bound secondary Search requests per repo
      PER_PAGE: '100'
      BACKFILL_DAYS: '120' # Explicit reconciliations; bootstrap retries 28/7/1-day windows
      COMPARISON_DAYS: '90'
      STALE_HOURS: '12'
      FRESHNESS_DAYS: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch pinned pre-curation snapshot commit for archival recovery
        run: git fetch --no-tags origin 0b7e80867c76d1dd3ba824a8749742e6757ff431
      - name: Curate audited 50-project membership; losslessly archive 25 prior reports
        run: python scripts/curate_verified_50.py
      - name: Restore last validated public snapshot
        run: python scripts/restore_public_snapshot.py
      - name: Publish a one-time archived 50-project cutover before expensive refresh
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/curated_50_transition_receipt.json ]; then
            echo 'Already curated on main; normal refresh only'
            exit 0
          fi
          cp data/github_public_snapshot.json.gz /tmp/curated_50_cutover.json.gz
          cp data/archived_75_to_50_reports.json.gz /tmp/curated_50_removed_archive.json.gz
          cp data/curated_50_transition_receipt.json /tmp/curated_50_receipt.json
          git config user.name 'Candy Ristyan'
          git config user.email '103526238+Granbe1l@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          # The receipt in the working tree is UNTRACKED and survives
          # git reset --hard. Check origin/main's Git tree, not the file.
          if git cat-file -e 'origin/main:data/curated_50_transition_receipt.json' 2>/dev/null; then
            echo 'Another audited cutover was already published'
            git cat-file -e 'origin/main:data/archived_75_to_50_reports.json.gz' || {
              echo 'Receipt exists without original archive; refusing inconsistent cutover'
              exit 1
            }
          else
            cp /tmp/curated_50_cutover.json.gz data/github_public_snapshot.json.gz
            cp /tmp/curated_50_removed_archive.json.gz data/archived_75_to_50_reports.json.gz
            cp /tmp/curated_50_receipt.json data/curated_50_transition_receipt.json
            git add data/github_public_snapshot.json.gz \
                    data/archived_75_to_50_reports.json.gz \
                    data/curated_50_transition_receipt.json
            git commit -m 'data: curate 50 Verified projects, archive all 25 excluded reports [skip ci]'
            git push origin HEAD:main
          fi
          # Main now contains the reviewed cutover; the checked-out files are
          # restored to it before collecting and replaying the refreshed binary.

      - name: Capture baseline coverage before collection
        run: python scripts/audit.py > snapshot-audit-before.json
      - name: Maintain expiring Verified sources then repair within API budget
        shell: bash
        run: |
          if python scripts/run_sync.py --expand --initial-batch 20 --max-requests 850 --audit-open-backlog --repair-coverage; then
            echo "GitHub ingestion returned complete checkpoints for visited repositories."
          else
            echo "::warning::Some GitHub sources incomplete or budget-limited; historical records and checkpoint status preserved."
          fi
          python scripts/build_public_snapshot.py
          python scripts/audit.py > snapshot-audit.json
          python - <<'PY'
          import json
          with open("snapshot-audit.json", encoding="utf-8") as f:
              report = json.load(f)
          print("SOURCE AUDIT:", json.dumps(report.get("coverage_summary", {}), sort_keys=True))
          PY
      - name: Summarize actual coverage progress
        run: python scripts/report_coverage_delta.py snapshot-audit-before.json snapshot-audit.json
      - name: Diagnose remaining source coverage gaps
        run: python scripts/coverage_triage.py snapshot-audit.json
      - name: Audit strict source-specific 28-day readiness and staleness
        run: python scripts/audit_coverage_readiness.py snapshot-audit.json
      - name: Preserve evidence and coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: github-50-repo-source-audit
          path: |
            data/github_public_snapshot.json.gz
            snapshot-audit.json
            snapshot-audit-before.json
            coverage-readiness.json
            data/curated_50_transition_receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate fresh collection progress before publishing
        run: python scripts/verify_collection.py snapshot-audit-before.json snapshot-audit.json
      - name: Benchmark validated real snapshot
        run: python scripts/benchmark_snapshot.py
      - name: Publish newest snapshot without binary rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Candy Ristyan'
          git config user.email '103526238+Granbe1l@users.noreply.github.com'
          # Git cannot merge two independently generated .gz files. Instead
          # replay only the newly collected artifact onto the latest main.
          cp data/github_public_snapshot.json.gz /tmp/new_public_snapshot.json.gz
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/new_public_snapshot.json.gz data/github_public_snapshot.json.gz
            git add data/github_public_snapshot.json.gz
            if git diff --cached --quiet; then
              echo 'No changes in the public snapshot'
              exit 0
            fi
            git commit -m 'data: update verified GitHub sample [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published updated snapshot successfully'
              exit 0
            fi
            echo "Concurrent push while publishing (attempt ${attempt}); retrying safely"
            sleep 3
          done
          echo 'Unable to publish snapshot safely after 3 attempts'
          exit 1
