name: Audit installed Python dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-audit.yml'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-audit.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  python-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project requirements and PyPA auditor
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Audit actual installed dependency versions for known vulnerabilities
        run: pip-audit --local --format json --output dependency-audit.json
      - name: Publish machine-readable evidence even after audit failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependency-vulnerability-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
