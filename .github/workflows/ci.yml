name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record tested Python and direct dependency versions
        run: python scripts/record_runtime_environment.py
      - name: Preserve installed-runtime audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-python-runtime
          path: tested-runtime.json
          if-no-files-found: warn
          retention-days: 14
      - run: python -m compileall -q src scripts streamlit_app.py
      - run: python -m pytest -q
      - name: Benchmark real curated snapshot (no fabricated data)
        run: python scripts/benchmark_snapshot.py
      - name: Audit real repository comparison readiness
        run: python scripts/audit_comparison_readiness.py
      - name: Preserve verified vs exploratory comparison audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-comparison-audit
          path: predeploy-comparison-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Restore real GitHub records and execute read-only SQL analytics
        env:
          DATABASE_URL: sqlite:///local.sqlite3
        run: |
          python scripts/restore_public_snapshot.py
          python scripts/sql_insights.py
      - name: Verify SQL / snapshot / Streamlit KPI consistency
        env:
          DATABASE_URL: sqlite:///local.sqlite3
        run: python scripts/verify_kpi_integrity.py
      - name: Benchmark real restored SQL loader query count
        env:
          DATABASE_URL: sqlite:///local.sqlite3
        run: python scripts/benchmark_sql_loader.py
      - name: Preserve real SQL performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-real-snapshot-sql-loader-benchmark
          path: sql-loader-benchmark.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate CV evidence receipt from real GitHub snapshot
        run: python scripts/cv_evidence.py
      - name: Audit reviewer findings against real GitHub source records
        run: python scripts/audit_reviewer_evidence.py
      - name: Audit three conditional real-record case studies
        run: python scripts/audit_case_studies.py
      - name: Preserve case-study evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-backed-case-studies
          path: case-study-evidence-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reviewer evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-evidence-integrity-audit
          path: reviewer-evidence-audit.json
          if-no-files-found: warn
          retention-days: 14
