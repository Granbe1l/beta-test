name: Verify public Streamlit deployment

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Public HTTPS app URL (for example your-app.streamlit.app)'
        required: true
        type: string
  workflow_run:
    workflows:
      - Refresh curated public GitHub snapshot
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  public-demo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.PUBLIC_APP_URL != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_APP_URL: ${{ inputs.app_url || vars.PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-browser verification dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Check real public dashboard, snapshot and navigation
        run: python scripts/verify_public_demo.py
      - name: Keep visual proof of public deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-streamlit-verification
          path: docs/screenshots/public-demo-*.png
          if-no-files-found: ignore
          retention-days: 14
