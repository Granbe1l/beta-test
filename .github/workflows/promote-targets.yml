name: Legacy targeted promotion disabled for pinned cohort
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-cohort:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy membership changes
        run: |
          echo "::error::The reviewed 50-repository cohort is pinned. An owner-approved cohort migration is required before promotion. Use the read-only candidate audit workflows."
          exit 1
