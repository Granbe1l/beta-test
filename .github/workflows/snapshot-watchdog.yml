name: Rescue stale public GitHub snapshot
on:
  # Best-effort independent monitor. Hourly GitHub cron is not a guarantee,
  # but reduces dependence on a single delayed six-hour schedule.
  schedule:
    # Shift minute to resync GitHub's best-effort scheduler.
    - cron: '47 * * * *'
  # Independent safety net when cron delivery is delayed but main-branch
  # quality checks still run. PR or failed checks never trigger a rescue.
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-watchdog.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: snapshot-watchdog-main
  cancel-in-progress: false
jobs:
  freshness-check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only GitHub API client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Check actual snapshot timestamp; dispatch only when stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_watchdog.py
      - name: Preserve honest freshness/backoff decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-snapshot-watchdog
          path: snapshot-watchdog-audit.json
          if-no-files-found: warn
          retention-days: 30
